<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <a href="">
            <img src="/images/noroff-logo.png" alt="Logo" class="h-10 w-auto" />
          </a>
        </div>

        <div class="menu">
          <a href="/post/create/" class="hover:text-secondary-light"><i class="fa-solid fa-plus text-2xl"></i></a>
        </div>
        <div class="profile-container"></div>
      </nav>
    </header>

    <main class="feed-page p-4">
      <h1>Feed</h1>
      <div class="feed-content grid grid-cols-[1fr_5fr] gap-1 w-full">
        <div class="allprofile-container flex flex-col w-40 h-full bg-slate-50  shadow-md transition-shadow duration-300 ease-in-out p-4 rounded-full items-center gap-3 max-h-screen overflow-x-hidden overflow-y-scroll"></div>
        <div class="feed-container flex flex-wrap gap-3 justify-center p-2 mx-auto"></div>
        
      </div>
      <div class="pagination"></div>
    </main>

    <footer class="footer">
      <p>&copy; 2024 Noroff</p>
    </footer>
  </body>
</html>
