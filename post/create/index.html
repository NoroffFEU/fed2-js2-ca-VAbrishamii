<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="menu">
        <a href="/post/feed/"><i class="fa-solid fa-house mr-2 hover:text-secondary-light"></i></a>
        <a href="/post/create/"><i class="fa-solid fa-plus hover:text-secondary-light"></i></a>
    
      </div>
      <div class="profile-container"></div>
    </nav>
    <main>
      <div class="create-post-container form-container">
        <h1 class="form-title">Create Post</h1>

        <form  class="create-post-form form-box" name="createPost">
          <input type="text" name="title" placeholder="Title" id="title" class="input-field"/>
          <textarea name="content" placeholder="Content" id="body" class="input-field"></textarea>
          <input type="text" name="image" id="media" placeholder="URL" alt="" class="input-field"/>
          <input type="text" name="tags" placeholder="Tags" id="tags" class="input-field" />
          <button class="btn hover:bg-secondary-light hover:text-text-light">Create Post</button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <p>&copy; 2024 Noroff</p>
    </footer>
  </body>
</html>
